<figure class="pista">
  <figcaption class="titulo">{{ titulo() }}</figcaption>
  <div class="cesped">
    <div class="lado">
      @if (jugadorReves() && enlaceReves(); as enlace) {
        <a class="jugador enlace" [routerLink]="enlace">{{ jugadorReves() }}</a>
      } @else {
        <span class="jugador">{{ jugadorReves() ?? 'Sin asignar' }}</span>
      }
      <span class="posicion">Revés</span>
    </div>
    <div class="lado">
      @if (jugadorDrive() && enlaceDrive(); as enlace) {
        <a class="jugador enlace" [routerLink]="enlace">{{ jugadorDrive() }}</a>
      } @else {
        <span class="jugador">{{ jugadorDrive() ?? 'Sin asignar' }}</span>
      }
      <span class="posicion">Drive</span>
    </div>
  </div>
</figure>
