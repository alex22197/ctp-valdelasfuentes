<section [attr.aria-labelledby]="idTitulo()">
  <header class="cabecera">
    <h2 class="titulo-seccion" [id]="idTitulo()">{{ grupo().titulo }}</h2>
    <p class="texto-secundario">
      {{ grupo().recuento.pueden }} de {{ grupo().recuento.total }} pueden
    </p>
  </header>

  <ul class="jugadores">
    @for (jugador of grupo().jugadores; track jugador.id) {
      <li>
        <ctp-fila-jugador-encuesta
          [jugador]="jugador"
          [guardando]="guardando().has(jugador.id)"
          [error]="errores().get(jugador.id) ?? null"
          (responder)="responder.emit({ jugador, respuesta: $event })"
        />
      </li>
    }
  </ul>
</section>
