<fieldset
  class="set"
  [class.set--error]="error()"
  [attr.aria-describedby]="error() ? idError : null"
>
  <legend class="titulo">Set {{ numeroSet() }}</legend>

  <div class="marcador">
    <label class="campo">
      <span class="etiqueta">Nosotros</span>
      <input
        class="numero"
        type="number"
        [attr.aria-invalid]="error() ? true : null"
        inputmode="numeric"
        min="0"
        max="7"
        [value]="valor().juegosNuestros"
        (input)="cambiar('juegosNuestros', $event)"
      />
    </label>
    <span class="guion" aria-hidden="true">–</span>
    <label class="campo">
      <span class="etiqueta">Rival</span>
      <input
        class="numero"
        type="number"
        [attr.aria-invalid]="error() ? true : null"
        inputmode="numeric"
        min="0"
        max="7"
        [value]="valor().juegosRival"
        (input)="cambiar('juegosRival', $event)"
      />
    </label>
  </div>

  <!-- Siempre presente para que el error se anuncie al aparecer mientras se escribe. -->
  <div aria-live="polite">
    @if (error(); as mensaje) {
      <p class="error" [id]="idError">{{ mensaje }}.</p>
    }
  </div>
</fieldset>
