<ul class="lista">
  @for (fila of filas(); track fila.id) {
    <li>
      @if (enlazar()) {
        <a class="ficha" [routerLink]="['/jugadores', fila.id]">
          <ng-container [ngTemplateOutlet]="contenido" />
        </a>
      } @else {
        <div class="ficha">
          <ng-container [ngTemplateOutlet]="contenido" />
        </div>
      }
      <ng-template #contenido>
        <span class="avatar" aria-hidden="true">{{ fila.iniciales }}</span>
        <span class="nombre">{{ fila.nombreMostrar }}</span>
        @if (fila.partidos === 0) {
          <span class="balance">Sin partidos</span>
        } @else {
          <span class="balance">
            {{ fila.partidos }}&nbsp;{{ fila.partidos === 1 ? 'partido' : 'partidos' }}
            <strong class="porcentaje">{{ fila.porcentajeVictorias }}&nbsp;%</strong>
            <span class="solo-lector"> ganados</span>
          </span>
          <span class="barra" aria-hidden="true">
            <span class="barra-ganados" [style.width.%]="fila.porcentajeVictorias"></span>
          </span>
        }
      </ng-template>
    </li>
  }
</ul>
