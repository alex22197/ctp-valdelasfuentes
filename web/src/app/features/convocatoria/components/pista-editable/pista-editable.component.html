<fieldset
  class="pista"
  [class.pista--error]="errores().length > 0"
  [attr.aria-describedby]="errores().length > 0 ? idErrores() : null"
>
  <legend class="titulo">{{ titulo() }}</legend>

  @if (hueco().bloqueado) {
    <p class="bloqueada">WO en contra: no juega nadie.</p>
  } @else {
    <div class="cesped">
      @for (ficha of fichas(); track ficha.lado) {
        <button
          type="button"
          class="ficha"
          [class.ficha--vacia]="ficha.nombre === null"
          [disabled]="deshabilitada()"
          [attr.aria-label]="ficha.etiquetaAccesible"
          (click)="abrir.emit({ clave: clave(), lado: ficha.lado })"
        >
          <!-- Se vuelve a crear al cambiar de jugador, para que aparezca con su animación. -->
          @for (id of [ficha.idJugador]; track id) {
            <span class="avatar" [style.view-transition-name]="nombreTransicion(ficha)">
              {{ ficha.iniciales }}
            </span>
          }
          <span class="nombre">{{ ficha.nombre ?? 'Elegir' }}</span>
          <span class="posicion">{{ ficha.posicion }}</span>
        </button>
      }
    </div>
  }

  @if (errores().length > 0) {
    <ul class="errores" [id]="idErrores()">
      @for (mensaje of errores(); track mensaje) {
        <li>{{ mensaje }}.</li>
      }
    </ul>
  }
</fieldset>
