<section class="pista" aria-labelledby="titulo-proxima-fase">

  <p class="titular">Rival por confirmar</p>
  <p class="explicacion">
    El cruce lo publica la liga cuando cierra la fase anterior. En cuanto se sepa, saldrá aquí con
    su convocatoria.
  </p>

  <ul class="detalles">

      <ctp-icono nombre="calendario" />

    </li>
    <li class="detalle">
      <ctp-icono nombre="ubicacion" />
      Sede por confirmar
    </li>
  </ul>
</section>
