<ctp-grafica-estadistica
  [opciones]="opciones()"
  [alto]="alto()"
  descripcion="Barras por jugador con las jornadas que jugó, las que podía sin ser convocado, las que no podía y las que no respondió. Los datos están en la tabla de debajo."
/>
<details class="datos">
  <summary>Ver los datos en una tabla</summary>
  <div class="desplazable">
    <table>
      <thead>
        <tr>
          <th scope="col">Jugador</th>
          <th scope="col">Jugó</th>
          <th scope="col">Podía</th>
          <th scope="col">No podía</th>
          <th scope="col">Sin responder</th>
        </tr>
      </thead>
      <tbody>
        @for (jugador of participacion(); track jugador.id) {
          <tr>
            <th scope="row">{{ jugador.nombreMostrar }}</th>
            <td>{{ jugador.jugadas }} de {{ jugador.confrontaciones }}</td>
            <td>{{ jugador.disponibleSinJugar }}</td>
            <td>{{ jugador.noDisponible }}</td>
            <td>{{ jugador.sinResponder }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</details>
